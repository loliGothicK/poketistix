name: Deploy Docs Search Index

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/content/docs/**'
      - 'apps/web/content/blog/**'
      - 'apps/web/scripts/index-docs.ts'
      - '.github/workflows/deploy-docs-search.yml'

jobs:
  deploy-index:
    name: Update D1 Index
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ./package.json
          
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
          
      - name: Install dependencies
        run: pnpm install

      - name: Generate content-collections
        run: pnpm --filter @poketistix/app exec content-collections build
        
      - name: Update D1 Index
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: pnpm --filter @poketistix/app run d1:index
