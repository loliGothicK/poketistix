name: Changesets

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "apps/web/package.json"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ./package.json

      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish release notes
        uses: changesets/action@v2.1.2
        with:
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          version-script: pnpm run version
          publish-script: pnpm exec changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
