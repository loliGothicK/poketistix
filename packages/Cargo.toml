[workspace]
members = ["damage-calc", "data", "engine", "kifu", "pkmn-meta"]
resolver = "2"

[profile.release]
opt-level = 3

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0"
tsify = { version = "0.5.8", features = ["js"] }
wasm-bindgen = "0.2"
deriving_via = "2.3.1"
derive-getters = "0.5.0"
typed-builder = "0.23.2"
itertools = "0.15.0"
